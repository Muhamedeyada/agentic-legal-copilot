name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: lint / typecheck / test / eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (hexagonal boundaries)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Evaluation harness (deterministic, no paid API)
        run: npm run eval

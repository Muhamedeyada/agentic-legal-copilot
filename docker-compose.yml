# D1T1 workstation: API :3001, nginx SPA :3000 and :5173 (same build).
# Leave OPENAI_API_KEY empty — mock completions, no paid API required.
services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      CLIENT_ORIGIN: http://localhost:3000,http://localhost:5173
      CORPUS_DIR: /app/data/corpus
      LLM_PROVIDER: openai
      OPENAI_API_KEY: ""
      REQUIRE_COUNSEL_APPROVAL: "true"
      RATE_LIMIT_PER_MINUTE: "60"
      MAX_PROMPT_CHARS: "12000"
      MAX_COMPLETION_CHARS: "8000"
      MAX_UPLOAD_CHARS: "200000"
    volumes:
      - ./data/corpus:/app/data/corpus:ro

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "3000:80"
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
